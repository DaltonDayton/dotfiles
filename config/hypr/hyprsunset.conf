# hyprsunset needs at least one profile or it tints the screen by default.
# nightlight-auto (home/.local/bin) sets the real state at sunrise/sunset, so
# this one only has to be a harmless startup default. Omarchy ships it at 07:00,
# which turns the night light off ahead of winter sunrise; noon is always day.
profile {
    time = 12:00
    identity = true
}
