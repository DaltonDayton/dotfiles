# Included from ~/.config/ghostty/config by the dotfiles ghostty feature.
# Ghostty loads config-file includes after the file that names them, so
# anything here overrides Omarchy's value.
font-size = 10

# Fade only the background; text stays opaque. Stacks with the
# hypr-tweaks window opacity (0.95/0.90), so the net effect is a bit stronger.
background-opacity = 0.9
