general {
    lock_cmd = systemctl --user start hyprlock-watch.service
    before_sleep_cmd = loginctl lock-session
    # Full dpms cycle: plain "dpms on" is a no-op when Hyprland thinks the
    # monitors are already on, leaving one stuck on the stale fbcon image
    # after S3 wake. The off/on forces a real modeset on every head.
    after_sleep_cmd = sh -c 'sleep 1; hyprctl dispatch dpms off; sleep 1; hyprctl dispatch dpms on'
}

# listener {
#     timeout = 150
#     on-timeout = brightnessctl -s set 10
#     on-resume = brightnessctl -r
# }

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
