[Service]
# Optimus laptop: enable the NVIDIA Optimus Vulkan layer so the dGPU is
# usable, and filter enumeration to NVIDIA only. Index-based selection
# (gpu_device) is unreliable here: enumeration order flips with environment,
# and it silently landed whisper on the Intel iGPU (14-16s transcriptions
# instead of ~2s). Vendor filter makes the dGPU index 0 deterministically.
Environment="__NV_PRIME_RENDER_OFFLOAD=1"
Environment="VOXTYPE_VULKAN_DEVICE=nvidia"
